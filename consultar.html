<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Consultar Registros</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .registro-lista {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .registro-item {
      background-color: #f9f9f9;
      border: 1px solid #ccc;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .registro-item p {
      margin: 0.3rem 0;
      font-size: 1rem;
    }

    .registro-item button {
      margin-right: 0.5rem;
      margin-top: 1rem;
      padding: 0.4rem 1rem;
      border: none;
      border-radius: 5px;
      background-color: #0aa3db;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .registro-item button:hover {
      background-color: #5c0fdf;
    }

    .registro-item button:last-child {
      background-color: #c62828;
    }

    .registro-item button:last-child:hover {
      background-color: #b71c1c;
    }

    .buttons {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .buttons button {
      padding: 0.6rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #12c32f;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .buttons button:hover {
      background-color: #7e19a6;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 style="text-align: center;">Consultar Registros</h1>
    </header>

    <section id="registrosList" class="registro-lista">
      <!-- Aquí se mostrarán los registros -->
    </section>

    <div class="buttons">
      <button onclick="window.location.href='registro.html'">Registrar Nueva mascota</button>
      <button onclick="window.location.href='index.html'">Volver al Menú</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const registros = JSON.parse(localStorage.getItem('peludos')) || [];
      const registrosList = document.getElementById('registrosList');

      if (registros.length === 0) {
        registrosList.innerHTML = "<p style='text-align:center;'>No hay registros disponibles.</p>";
        return;
      }

      registros.forEach((registro, index) => {
        const div = document.createElement('div');
        div.classList.add('registro-item');
        div.innerHTML = `
          <p><strong>Nombre:</strong> ${registro.nombre}</p>
          <p><strong>Edad:</strong> ${registro.edad}</p>
          <p><strong>Raza:</strong> ${registro.Raza || 'N/A'}</p>
          <div class="acciones">
            <button onclick="verRegistro(${index})">Ver</button>
            <button onclick="editarRegistro(${index})">Editar</button>
            <button onclick="eliminarRegistro(${index})">Eliminar</button>
          </div>
        `;
        registrosList.appendChild(div);
      });
    });

    function verRegistro(index) {
      localStorage.setItem('verIndex', index);
      window.location.href = 'ver.html';
    }

    function editarRegistro(index) {
      window.location.href = `registro.html?index=${index}`;
    }

    function eliminarRegistro(index) {
      if (confirm("¿Estás seguro de que deseas eliminar este registro?")) {
        const registros = JSON.parse(localStorage.getItem('peludos')) || [];
        registros.splice(index, 1);
        localStorage.setItem('peludos', JSON.stringify(registros));
        location.reload(); // Recarga la página para reflejar los cambios
      }
    }
  </script>
</body>
</html>
