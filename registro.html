<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Animal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Registro de Animal</h1>
    </header>

    <form id="registroForm">
      <h2>Datos del Animal</h2>
      <label for="nombre">Nombre del Animal</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="edad">Edad</label>
      <input type="number" id="edad" name="edad" required>

      <label for="raza">Raza</label>
      <input type="text" id="raza" name="raza">

      <label for="medicamentos">Medicamentos</label>
      <input type="text" id="medicamentos" name="medicamentos">

      <label for="seguroMedico">Seguro Médico</label>
      <input type="text" id="seguroMedico" name="seguroMedico">

      <label for="domicilio">Domicilio</label>
      <input type="text" id="domicilio" name="domicilio" required>

      <h2>Contactos de Emergencia</h2>
      <label for="contacto1_nombre">Nombre</label>
      <input type="text" id="contacto1_nombre" name="contacto1_nombre">

      <label for="contacto1_parentesco">Parentesco</label>
      <input type="text" id="contacto1_parentesco" name="contacto1_parentesco">

      <label for="contacto1_telefono">Teléfono</label>
      <input type="tel" id="contacto1_telefono" name="contacto1_telefono">

      <label for="contacto2_nombre">Nombre</label>
      <input type="text" id="contacto2_nombre" name="contacto2_nombre">

      <label for="contacto2_parentesco">Parentesco</label>
      <input type="text" id="contacto2_parentesco" name="contacto2_parentesco">

      <label for="contacto2_telefono">Teléfono</label>
      <input type="tel" id="contacto2_telefono" name="contacto2_telefono">

      <div class="buttons">
        <button type="submit">Guardar Registro</button>
        <button type="button" onclick="window.location.href='index.html'">Volver al Menú</button>
      </div>
    </form>
  </div>

  <script src="registro.js"></script>
</body>
</html>
